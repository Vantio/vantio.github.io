<html>
 <head>
  <title>
   PlayStation Store - Redeem Code
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
            font-family: 'Roboto', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        .fade-out {
            animation: fadeOut 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
  </style>
 </head>
 <body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center">
  <div class="w-full max-w-md mx-auto p-6 bg-gray-800 rounded-lg shadow-lg fade-in" id="main-box">
   <div class="flex justify-center mb-6">
    <img alt="PlayStation logo with blue background and white text" class="w-24 h-24" height="100" src="https://freepnglogo.com/images/all_img/1716829610playstation-logo.png" width="100"/>
   </div>
   <h1 class="text-2xl font-bold text-center mb-4">
    Redeem Your PlayStation Code
   </h1>
   <form class="space-y-4" id="online-id-form">
    <div>
     <label class="block text-sm font-medium" for="online-id">
      Online ID
     </label>
     <input class="w-full p-2 mt-1 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" id="online-id" required="" type="text"/>
    </div>
    <button class="w-full py-2 bg-blue-600 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500" type="submit">
     Next
    </button>
   </form>
   <form class="space-y-4 hidden" id="code-form">
    <div>
     <label class="block text-sm font-medium" for="code">
      Enter Code
     </label>
     <input class="w-full p-2 mt-1 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" id="code" required="" type="text"/>
    </div>
    <button class="w-full py-2 bg-gray-600 rounded cursor-not-allowed" id="redeem-button" type="submit" disabled>
     Redeem
    </button>
   </form>
   <div class="hidden text-center text-yellow-500 mt-4 fade-in" id="loading">
    Checking code...
   </div>
   <div class="hidden text-center mt-4 fade-in" id="success">
    <i class="fas fa-check-circle" id="success-icon">
    </i>
    <span id="success-text">
     Code is valid!
    </span>
   </div>
   <div class="hidden text-center mt-4 fade-in" id="invalid">
    <i class="fas fa-times-circle" id="invalid-icon">
    </i>
    <span id="invalid-text">
     Code is invalid!
    </span>
   </div>
   <div class="hidden text-center text-red-500 mt-4 fade-in" id="error">
    <i class="fas fa-exclamation-circle">
    </i>
    The account entered isn't eligible for the code.
   </div>
  </div>
  <script>
   const validCodes = ['ABC123', 'XYZ789', 'PSN456', '1234']; // Add valid codes here

        document.getElementById('online-id-form').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('main-box').classList.add('fade-out');
            setTimeout(function() {
                document.getElementById('online-id-form').classList.add('hidden');
                document.getElementById('code-form').classList.remove('hidden');
                document.getElementById('main-box').classList.remove('fade-out');
                document.getElementById('main-box').classList.add('fade-in');
            }, 500);
        });

        let typingTimer;
        const doneTypingInterval = 2000; // 2 seconds
        const codeInput = document.getElementById('code');
        const redeemButton = document.getElementById('redeem-button');

        codeInput.addEventListener('keyup', function() {
            clearTimeout(typingTimer);
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('success').classList.add('hidden');
            document.getElementById('invalid').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            typingTimer = setTimeout(doneTyping, doneTypingInterval);
        });

        codeInput.addEventListener('keydown', function() {
            clearTimeout(typingTimer);
        });

        function doneTyping() {
            const codeValue = codeInput.value.trim();
            document.getElementById('loading').classList.add('fade-out');
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('loading').classList.remove('fade-out');
                if (validCodes.includes(codeValue)) {
                    document.getElementById('success').classList.remove('hidden');
                    document.getElementById('success').classList.add('fade-in');
                    document.getElementById('success-icon').classList.remove('text-red-500');
                    document.getElementById('success-icon').classList.add('text-green-500');
                    document.getElementById('success-text').classList.remove('text-red-500');
                    document.getElementById('success-text').classList.add('text-green-500');
                    document.getElementById('success-text').innerText = 'Code is valid!';
                    redeemButton.disabled = false;
                    redeemButton.classList.remove('bg-gray-600', 'cursor-not-allowed');
                    redeemButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
                } else {
                    document.getElementById('invalid').classList.remove('hidden');
                    document.getElementById('invalid').classList.add('fade-in');
                    document.getElementById('invalid-icon').classList.add('text-red-500');
                    document.getElementById('invalid-text').classList.add('text-red-500');
                    document.getElementById('invalid-text').innerText = 'Code is invalid!';
                    redeemButton.disabled = true;
                    redeemButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    redeemButton.classList.add('bg-gray-600', 'cursor-not-allowed');
                }
            }, 500);
        }

        document.getElementById('code-form').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error').classList.add('fade-in');
        });
  </script>
 </body>
</html>
